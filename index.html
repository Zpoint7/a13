<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحويل للتقييم...</title>

    <!-- الطريقة الأولى: التحويل اللحظي عبر HTML -->
    <!-- الرقم 0 يعني التحويل بعد 0 ثانية -->
    <meta http-equiv="refresh" content="0; url=https://share.google/yadHZG06ecHb9u7Gn">

    <!-- الطريقة الثانية: التحويل عبر JavaScript كطبقة أمان إضافية -->
    <script>
        // نستخدم replace بدلاً من href لمنع حفظ صفحة التحويل في سجل متصفح العميل
        window.location.replace("https://share.google/yadHZG06ecHb9u7Gn");
    </script>

    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            color: #333;
        }
        .container {
            padding: 20px;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <h2>جاري تحويلك إلى صفحة التقييم...</h2>
        <p>إذا لم يتم تحويلك تلقائياً، <a href="https://share.google/yadHZG06ecHb9u7Gn">اضغط هنا</a>.</p>
    </div>
</body>
</html>
